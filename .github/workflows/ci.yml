name: CI

permissions:
  contents: read

# The | separator falls back to the module's source repo on any proxy error, not just 404/410.
env:
  GOPROXY: https://proxy.golang.org|direct

on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
jobs:
  release-linux-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
            go_arch_name: amd64
          - goarch: arm64
            runner: ubuntu-24.04-arm
            go_arch_name: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:22.04
    steps:
      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y gcc g++ make git curl tar gzip file binutils libsqlite3-dev

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Go
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          curl -fsSL --retry 5 --retry-all-errors --retry-max-time 120 \
            "https://go.dev/dl/go${GO_VERSION}.linux-${{ matrix.go_arch_name }}.tar.gz" -o go.tar.gz
          tar -C /usr/local -xzf go.tar.gz
          rm go.tar.gz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Build Linux release binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          export PATH="/usr/local/go/bin:$HOME/go/bin:$PATH"
          COMMIT=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          VERSION="ci-$COMMIT"

          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -o dist/msgvault-codex-bridge ./cmd/msgvault-codex-bridge
          BRIDGE_SHA256=$(sha256sum dist/msgvault-codex-bridge | cut -d' ' -f1)
          LDFLAGS="-s -w -X go.kenn.io/msgvault/cmd/msgvault/cmd.Version=${VERSION} -X go.kenn.io/msgvault/cmd/msgvault/cmd.Commit=${COMMIT} -X go.kenn.io/msgvault/cmd/msgvault/cmd.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X go.kenn.io/msgvault/internal/peoplesweep.codexBridgeSHA256=${BRIDGE_SHA256} -extldflags '-lstdc++ -lm'"
          go build -tags "fts5 sqlite_vec" -trimpath -buildvcs=false -ldflags="$LDFLAGS" -o dist/msgvault ./cmd/msgvault

          echo "--- Binary info ---"
          file dist/msgvault dist/msgvault-codex-bridge
          ldd dist/msgvault || true

          echo "--- Runtime requirements ---"
          objdump -T dist/msgvault 2>/dev/null | grep -oP 'GLIBC_\d+\.\d+' | sort -uV | tail -1 || true
          objdump -T dist/msgvault 2>/dev/null | grep -oP 'GLIBCXX_\d+\.\d+(\.\d+)?' | sort -uV | tail -1 || true

          echo "--- Smoke test ---"
          SMOKE_OUT=$(dist/msgvault version 2>&1)
          echo "$SMOKE_OUT"
          echo "$SMOKE_OUT" | grep -q "$VERSION" || { echo "FATAL: version output doesn't match CI build version"; exit 1; }

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # ripgrep lets the scripts package run check-docs-media.sh for real.
      - name: Install SQLite development headers and ripgrep
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev ripgrep

      - name: Check Huma API contracts
        run: make huma-check

      - name: Install lint tools
        run: |
          make lint-tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # The three largest packages run in test-sharded below; this covers the
      # rest. Together they are exactly `make test`.
      - name: Test
        run: make test-unsharded

      - name: Test build without vector backends
        run: go test -tags fts5 -run '^TestDocumentVectorStubKeepsStatusAvailableAndBuildActionable$' -count=1 ./cmd/msgvault/cmd

      - name: Check OpenAPI artifacts
        run: make openapi-check

      - name: Lint
        run: make lint-ci

      - name: Vulnerability check
        run: make vulncheck

  # The packages in SHARDED_TEST_PKGS (Makefile) each hold thousands of tests
  # that run one at a time inside one binary, so whole they set the wall clock
  # of the test lane. Each runs here as four concurrent processes of the same
  # binary using scripts/test-package-shards.sh on its own runner.
  test-sharded:
    name: test-sharded (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cli
            package: ./cmd/msgvault/cmd
          - name: store
            package: ./internal/store
          - name: api
            package: ./internal/api
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install SQLite development headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Test package in isolated shards
        run: scripts/test-package-shards.sh "${{ matrix.package }}" 4 "fts5 sqlite_vec" 60m

  test-macos-15:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

  frontend:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install container build tools
        # Mirror hiccups have hung plain apt-get for 15+ minutes; bounded
        # timeouts plus retries turn an outage into a short delay.
        run: |
          # The pinned Playwright image already provides Node, while its
          # preconfigured NodeSource repository rejects CI runner traffic.
          # Bun is installed separately below, so only Ubuntu sources are
          # needed for the native build toolchain.
          rm -f /etc/apt/sources.list.d/nodesource.list
          for attempt in 1 2 3; do
            if apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 gcc g++ make unzip libsqlite3-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying" >&2
            sleep 30
          done
          exit 1

      - name: Trust the checkout in the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: 'true'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # web-assets-check builds and embeds the UI, then runs the asset
      # validator's own tests.
      - name: Check, test, and build frontend
        run: make web-check web-test web-assets-check

      # The e2e specs generate their archive fixture by running a Go test;
      # compile it here so the first Playwright test doesn't pay the cold
      # cgo build inside its own timeout.
      - name: Precompile e2e archive fixture
        run: go test -tags "fts5 sqlite_vec" -run '^$' -count=1 ./internal/query

      - name: Run browser, visual, accessibility, and end-to-end tests
        run: make web-test-browser

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-browser-failures
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  large-archive-benchmark:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run mixed-archive analytical reference benchmark
        run: |
          go test -tags "fts5 sqlite_vec" ./internal/query -run '^$' \
            -bench '^BenchmarkExploreLargeArchive$' -benchtime=3x -count=1 \
            | tee large-archive-benchmark.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: large-archive-benchmark
          path: large-archive-benchmark.txt
          if-no-files-found: error
